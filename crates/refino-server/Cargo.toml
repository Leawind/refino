[package]
name = "refino-server"
description = "Local HTTP service for Decision Lineage Graphs (DLG): the Web API, SSE change feed and static hosting of the @refino/ui build."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
refino-core = { workspace = true }
refino-storage = { workspace = true }
refino-fs = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
futures = "0.3"
tokio-stream = "0.1"
