name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  # One UI build feeds every platform binary: the server embeds it at compile
  # time (crates/refino-server/build.rs), so the published binary carries the
  # interface and needs no node_modules at runtime.
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: packages/ui/dist

  # Build the native refino binary per platform. Artifacts feed the publish
  # job, which assembles them into the npm platform packages
  # (@refino/cli-<platform>-<arch>, packages/cli-*/).
  build-binaries:
    needs: build-ui
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: win32-x64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
          - triple: darwin-x64
            runs-on: macos-latest
            target: x86_64-apple-darwin
          - triple: darwin-arm64
            runs-on: macos-latest
            target: aarch64-apple-darwin
          - triple: linux-x64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - triple: linux-arm64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      # The UI build is embedded by build.rs; without it the binary would
      # only serve the placeholder page.
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: packages/ui/dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --target ${{ matrix.target }} -p refino

      - name: Strip the binary
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/refino

      # Every artifact stages its binary under one shared name shape,
      # refino-<triple>, so the publish job can place it without per-OS logic
      # beyond the .exe rename.
      - name: Stage artifact
        shell: bash
        run: |
          set -e
          binary=target/${{ matrix.target }}/release/refino
          [ -f "$binary.exe" ] && binary="$binary.exe"
          cp "$binary" "refino-${{ matrix.triple }}"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.triple }}
          path: refino-${{ matrix.triple }}

  publish:
    needs: build-binaries
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # npm >= 11.5.1 (bundled with node 24) is required for trusted publishing
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist-binaries

      # A binary published without its embedded UI would ship a placeholder
      # page; check the one artifact that runs on this runner before publishing.
      - name: Smoke-test the embedded web UI
        run: |
          set -euo pipefail
          bin=dist-binaries/cli-linux-x64/refino-linux-x64
          chmod +x "$bin"
          tmp=$(mktemp -d)
          "$bin" init --root "$tmp" >/dev/null
          "$bin" web --root "$tmp" --port 5711 >"$tmp/web.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do curl -sf http://127.0.0.1:5711/ >/dev/null && break; sleep 0.2; done
          curl -sf http://127.0.0.1:5711/ | grep -q '<div id="app">'
          ! grep -q 'carries no web UI' "$tmp/web.log"
          curl -sf http://127.0.0.1:5711/api/stats >/dev/null

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: Build packages
        run: pnpm -r build

      - name: Assemble platform packages
        shell: bash
        run: |
          set -e
          for dir in packages/cli-*/; do
            triple=${dir#packages/cli-}; triple=${triple%/}
            mkdir -p "$dir/bin"
            if [ "${triple%%-*}" = "win32" ]; then
              cp "dist-binaries/cli-$triple/refino-$triple" "$dir/bin/refino.exe"
            else
              cp "dist-binaries/cli-$triple/refino-$triple" "$dir/bin/refino"
              chmod +x "$dir/bin/refino"
            fi
          done

      # Publish via npm trusted publishing (OIDC): no NPM_TOKEN needed.
      # Requires each package — the platform packages included — to have a
      # "Trusted Publisher" configured on npmjs.com pointing to this repo
      # and this workflow file. pnpm -r publish walks the workspace in
      # topological (dependency) order, skips private packages and versions
      # already on npm, and replaces workspace:^ / workspace:* deps with
      # real version ranges, so the platform packages ship before the shell
      # that pins them.
      - name: Publish packages
        run: pnpm -r publish --access public --provenance --no-git-checks
