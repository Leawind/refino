name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # npm >= 11.5.1 (bundled with node 24) is required for trusted publishing
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # Publish via npm trusted publishing (OIDC): no NPM_TOKEN needed.
      # Requires each package to have a "Trusted Publisher" configured on
      # npmjs.com pointing to this repo and this workflow file.
      - name: Build packages
        run: pnpm -r build

      # pnpm -r publish walks the workspace in topological (dependency) order,
      # skips private packages and versions already on npm, and replaces
      # workspace:^ deps with real version ranges. New packages are picked up
      # without workflow changes.
      - name: Publish packages
        run: pnpm -r publish --access public --provenance --no-git-checks
